name: Update Apple Price Atlas data

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 10:00 Australia/Perth (02:00 UTC).
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh weekly data
        run: node scripts/update-data.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-status.js
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update weekly Apple price data"
            git push
          fi
